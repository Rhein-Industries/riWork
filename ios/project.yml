name: RiWorkRemote
options:
  bundleIdPrefix: com.riwork
  deploymentTarget:
    iOS: "18.0"
  # Debug builds allow cleartext loopback (the simulator's local relay); Release keeps default ATS.
  # Info-Debug.plist is Info.plist plus that exception, derived here so the two cannot drift.
  postGenCommand: >-
    cp RiWorkRemote/Info.plist RiWorkRemote/Info-Debug.plist &&
    /usr/libexec/PlistBuddy
    -c 'Add :NSAppTransportSecurity dict'
    -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true'
    RiWorkRemote/Info-Debug.plist
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RiWorkCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.riwork.remote.core
  RiWorkRemote:
    type: application
    platform: iOS
    sources:
      - path: RiWorkRemote
        excludes: [Info-Debug.plist]
    dependencies:
      - target: RiWorkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riwork.remote
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: RiWorkRemote/Info-Debug.plist
    # False in both plists: encryption calls are limited to Apple OS frameworks.
    # See docs/export-compliance.md. postGenCommand copies Info.plist, then
    # adds only the Debug ATS exception, so this Boolean stays the same.
    info:
      path: RiWorkRemote/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: RiWork
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # ProMotion for everything the app animates or redraws; scrolling itself is already at 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPhone is portrait only; the iPad list below is unchanged.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan a pairing code from your RiWork desktop, or take a photo to send to a terminal or chat on it.
        NSLocalNetworkUsageDescription: Connect to a RiWork relay on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: com.riwork.remote.pair
            CFBundleURLSchemes: [riwork]
  RiWorkCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RiWorkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RiWorkAppTests:
    type: bundle.unit-test
    platform: iOS
    # SyntheticTranscript is shared with the core tests: the benchmarks of the parse and of the painting use the same content.
    sources:
      - AppTests
      - Tests/SyntheticTranscript.swift
    dependencies:
      - target: RiWorkRemote
      - target: RiWorkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RiWorkRemote:
    build:
      targets:
        RiWorkRemote: all
        RiWorkCoreTests: [test]
        RiWorkAppTests: [test]
    test:
      targets: [RiWorkCoreTests, RiWorkAppTests]
