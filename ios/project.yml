name: RiWorkRemote
options:
  bundleIdPrefix: com.riwork
  deploymentTarget:
    iOS: "18.0"
  # Debug builds allow cleartext loopback (the simulator's local relay); Release keeps default ATS.
  # Info-Debug.plist is Info.plist plus that exception, derived here so the two cannot drift.
  postGenCommand: >-
    cp RiWorkRemote/Info.plist RiWorkRemote/Info-Debug.plist &&
    /usr/libexec/PlistBuddy
    -c 'Add :NSAppTransportSecurity dict'
    -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true'
    RiWorkRemote/Info-Debug.plist
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RiWorkCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.riwork.remote.core
  RiWorkRemote:
    type: application
    platform: iOS
    sources:
      - path: RiWorkRemote
        excludes: [Info-Debug.plist]
    dependencies:
      - target: RiWorkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riwork.remote
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: RiWorkRemote/Info-Debug.plist
    # ITSAppUsesNonExemptEncryption is omitted from info.properties on purpose.
    # xcodegen writes Info.plist from the properties below, then postGenCommand
    # copies it to Info-Debug.plist and adds only the Debug ATS exception.
    # Leave the key out of both plists until docs/export-compliance.md records
    # an account-holder outcome. A Boolean here would be copied into both.
    info:
      path: RiWorkRemote/Info.plist
      properties:
        CFBundleDisplayName: RiWork
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan a pairing code from your RiWork desktop.
        NSLocalNetworkUsageDescription: Connect to a RiWork relay on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: com.riwork.remote.pair
            CFBundleURLSchemes: [riwork]
  RiWorkCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RiWorkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RiWorkAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: RiWorkRemote
      - target: RiWorkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RiWorkRemote:
    build:
      targets:
        RiWorkRemote: all
        RiWorkCoreTests: [test]
        RiWorkAppTests: [test]
    test:
      targets: [RiWorkCoreTests, RiWorkAppTests]
