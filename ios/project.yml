name: RiWorkRemote
options:
  bundleIdPrefix: com.riwork
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RiWorkCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.riwork.remote.core
  RiWorkRemote:
    type: application
    platform: iOS
    sources: [RiWorkRemote]
    dependencies:
      - target: RiWorkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riwork.remote
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: RiWorkRemote/Info.plist
      properties:
        CFBundleDisplayName: RiWork
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan a pairing code from your RiWork desktop.
        NSLocalNetworkUsageDescription: Connect to a RiWork relay on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.riwork.remote.pair
            CFBundleURLSchemes: [riwork]
  RiWorkCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RiWorkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RiWorkAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: RiWorkRemote
      - target: RiWorkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RiWorkRemote:
    build:
      targets:
        RiWorkRemote: all
        RiWorkCoreTests: [test]
        RiWorkAppTests: [test]
    test:
      targets: [RiWorkCoreTests, RiWorkAppTests]
