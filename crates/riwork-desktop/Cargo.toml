[package]
name = "riwork-desktop"
version = "0.1.0"
edition = "2024"
# Keep the legacy src/main.rs as an uncompiled parity reference.
autobins = false

[[bin]]
name = "riwork"
path = "src/nsh_main.rs"

[dependencies]
riwork-core = { path = "../riwork-core" }
riwork-engine = { path = "../riwork-engine" }
riwork-cli = { path = "../riwork-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "=0.3.0"
nsh-engine = "=0.3.0"
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
dispatch2 = "0.3"
block2 = "0.6"
env_logger = "0.11"

# P1a integration: replace src/nsh_native_stub.rs with
# riwork-nsh-native = { path = "../riwork-nsh-native" }
# and `use riwork_nsh_native as native` in nsh_host.rs. The frozen JS name
# remains `riwork/native`. P1a is not present at the branch base ea0f2f5.
