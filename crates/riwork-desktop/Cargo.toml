[package]
name = "riwork-desktop"
version = "0.1.0"
edition = "2024"
# Keep the legacy src/main.rs as an uncompiled parity reference.
autobins = false

[features]
terminal-fixture = ["riwork-nsh-terminal/terminal-fixture"]

[[bin]]
name = "riwork"
path = "src/nsh_main.rs"

[[test]]
name = "appkit_shell"
path = "tests/appkit_shell.rs"
harness = false

[[test]]
name = "startup_environment"
path = "tests/startup_environment.rs"
harness = false

[dependencies]
riwork-core = { path = "../riwork-core" }
riwork-engine = { path = "../riwork-engine" }
riwork-cli = { path = "../riwork-cli" }
serde = { version = "1", features = ["derive"] }
# The GPUI dependency graph enabled insertion-ordered JSON maps. Keep the
# frozen CLI's byte output (notably settings list --json) across the host port.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
riwork-nsh-native = { path = "../riwork-nsh-native" }
riwork-nsh-terminal = { path = "../riwork-nsh-terminal" }
riwork-nsh-workspace = { path = "../../apps/riwork" }
tokio = { version = "1", features = ["rt-multi-thread"] }
nsh-platform-macos = "=0.3.0"
nsh-engine = "=0.3.0"
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSFontManager"] }
dispatch2 = "0.3"
block2 = "0.6"
env_logger = "0.11"
# One process-wide RIWORK_HOME watcher drives the notification and wake services.
notify = "=8.2.0"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
anyhow = "1"
