[package]
name = "riwork-nsh-native"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
riwork-core = { path = "../riwork-core" }
riwork-engine = { path = "../riwork-engine" }
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
anyhow = "1"
async-channel = "2.5"
futures-util = "0.3"
notify = "=8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
nsh-engine = "=0.3.0"
tempfile = "3"
