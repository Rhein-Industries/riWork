[package]
name = "riwork-nsh-native"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
test-support = ["riwork-engine/test-support", "riwork-nsh-workspace/test-support"]

[[example]]
name = "p1_fixture_home"
required-features = ["test-support"]

# W1's p1-layouts/p1-basic/p1-restore homes with workspace fake sessions.
[[example]]
name = "p1_workspace_fixture_home"
required-features = ["test-support"]

[dependencies]
riwork-core = { path = "../riwork-core" }
riwork-engine = { path = "../riwork-engine" }
riwork-nsh-workspace = { path = "../../apps/riwork" }
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
async-channel = "2.5"
futures-util = "0.3"
libc = "0.2"
notify = "=8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nsh-engine = "=0.3.0"
# The engine's in-process chat host with fake and replayed provider drivers.
riwork-engine = { path = "../riwork-engine", features = ["test-support"] }
tempfile = "3"
