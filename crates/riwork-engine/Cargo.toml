[package]
name = "riwork-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = []

[dependencies]
riwork-core = { path = "../riwork-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
chrono = "0.4"
image = "=0.25.10"
base64 = "0.22"
libc = "0.2"
