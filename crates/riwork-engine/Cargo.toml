[package]
name = "riwork-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = []

[dependencies]
riwork-core = { path = "../riwork-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
fs2 = "0.4"
sha2 = "0.10"
chrono = "0.4"
image = "=0.25.10"
base64 = "0.22"
libc = "0.2"
toml_edit = "0.22"
unicode-normalization = "0.1"
# Already in the lockfile (rustls-native-certs); the Anthropic API key's Keychain item.
security-framework = "3"
# Already in the lockfile (globwalk); `.gitignore` rules for the composer's file suggestions.
ignore = "0.4"
ureq = "3"
