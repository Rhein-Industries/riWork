[package]
name = "riwork-nsh-terminal"
version.workspace = true
edition.workspace = true

[features]
terminal-fixture = []

[dependencies]
base64 = "0.22"
riwork-core = { path = "../riwork-core" }
riwork-engine = { path = "../riwork-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-core = "=0.3.0"
nsh-platform-macos = "=0.3.0"
dispatch2 = "0.3"

[build-dependencies]
cc = "1"
sha2 = "0.10"
serde_json = "1"
