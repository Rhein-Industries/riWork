[package]
name = "riwork"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.5", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", features = ["font-kit", "runtime_shaders"] }
gpui-libghostty = "=0.3.1"
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
chrono = "0.4"
image = "=0.25.10"
libc = "0.2"
core-foundation-sys = "0.8"
objc2 = "0.6"
raw-window-handle = "0.6"

[profile.dev]
debug = 0
incremental = false
