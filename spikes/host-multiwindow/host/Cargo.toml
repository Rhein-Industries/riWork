[package]
name = "riwork-nsh-multiwindow-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-platform-macos = "=0.3.0"
nsh-engine = "=0.3.0"
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
nsh-dev = { version = "=0.3.0", features = ["client"] }
riwork-nsh-probe = { path = "../app" }
serde_json = "1"
block2 = "0.6"
env_logger = "0.11"

[profile.release]
debug = 0
