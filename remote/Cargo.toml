[package]
name = "riwork-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Standalone: deliberately does not depend on the GPUI desktop crate.
[workspace]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
fs2 = "0.4"
url = "2"
anyhow = "1"
hex = "0.4"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
