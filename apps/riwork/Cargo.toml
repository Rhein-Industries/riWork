[package]
name = "riwork-nsh-workspace"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"
riwork-core = { path = "../../crates/riwork-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
